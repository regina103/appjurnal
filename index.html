<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0e7c66" />
  <meta name="description" content="Jurnal Keuangan Syariah - catat keuangan sesuai prinsip syariah" />
  <title>Jurnal Syariah</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/icon.svg" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app">
    <!-- Header -->
    <header class="app-header" id="appHeader">
      <div class="header-inner">
        <h1 id="pageTitle">Beranda</h1>
        <button class="icon-btn" id="themeToggle" aria-label="Ganti tema" title="Ganti tema">🌙</button>
      </div>
    </header>

    <!-- Konten per halaman dirender oleh ui.js -->
    <main id="view" class="view"></main>

    <!-- Tombol tambah transaksi mengambang -->
    <button class="fab" id="fabAdd" aria-label="Tambah transaksi">+</button>

    <!-- Navigasi bawah -->
    <nav class="bottom-nav" id="bottomNav">
      <button class="nav-item active" data-page="beranda">
        <span class="nav-ico">🏠</span><span class="nav-lbl">Beranda</span>
      </button>
      <button class="nav-item" data-page="transaksi">
        <span class="nav-ico">📒</span><span class="nav-lbl">Transaksi</span>
      </button>
      <button class="nav-item" data-page="zakat">
        <span class="nav-ico">🕌</span><span class="nav-lbl">Zakat</span>
      </button>
      <button class="nav-item" data-page="laporan">
        <span class="nav-ico">📊</span><span class="nav-lbl">Laporan</span>
      </button>
    </nav>
  </div>

  <!-- Modal (form transaksi, dll) -->
  <div class="modal-overlay" id="modalOverlay" hidden>
    <div class="modal" id="modal" role="dialog" aria-modal="true"></div>
  </div>

  <!-- Toast notifikasi -->
  <div class="toast" id="toast" hidden></div>

  <script src="js/db.js"></script>
  <script src="js/zakat.js"></script>
  <script src="js/laporan.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
