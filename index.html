<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#c67e92" />
  <meta name="description" content="I'MNote - catat uang saku, atur pengeluaran, dan menabung" />
  <title>I'MNote</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/icon.svg" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- Gerbang login / daftar (ditampilkan sebelum user masuk) -->
  <div id="authGate" class="auth-gate" hidden></div>

  <div id="app" hidden>
    <!-- Header -->
    <header class="app-header" id="appHeader">
      <div class="header-inner">
        <h1 id="pageTitle">Beranda</h1>
        <div class="header-actions">
          <button class="icon-btn" id="themeToggle" aria-label="Ganti tema" title="Ganti tema">🌙</button>
          <button class="icon-btn" id="logoutBtn" aria-label="Keluar" title="Keluar" hidden>🚪</button>
        </div>
      </div>
    </header>

    <!-- Konten per halaman dirender oleh ui.js -->
    <main id="view" class="view"></main>

    <!-- Tombol tambah transaksi mengambang -->
    <button class="fab" id="fabAdd" aria-label="Tambah transaksi">+</button>

    <!-- Navigasi bawah -->
    <nav class="bottom-nav" id="bottomNav">
      <button class="nav-item active" data-page="beranda">
        <span class="nav-ico">🏠</span><span class="nav-lbl">Beranda</span>
      </button>
      <button class="nav-item" data-page="transaksi">
        <span class="nav-ico">📒</span><span class="nav-lbl">Transaksi</span>
      </button>
      <button class="nav-item" data-page="tabungan">
        <span class="nav-ico">🐷</span><span class="nav-lbl">Tabungan</span>
      </button>
      <button class="nav-item" data-page="laporan">
        <span class="nav-ico">📊</span><span class="nav-lbl">Laporan</span>
      </button>
      <button class="nav-item" data-page="profil">
        <span class="nav-ico">👤</span><span class="nav-lbl">Profil</span>
      </button>
    </nav>
  </div>

  <!-- Modal (form transaksi, dll) -->
  <div class="modal-overlay" id="modalOverlay" hidden>
    <div class="modal" id="modal" role="dialog" aria-modal="true"></div>
  </div>

  <!-- Toast notifikasi -->
  <div class="toast" id="toast" hidden></div>

  <!-- SDK Supabase (UMD). Jika CDN utama gagal (umum di koneksi HP),
       muat dari CDN cadangan agar aplikasi tetap jalan. -->
  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    onerror="var s=document.createElement('script');s.src='https://unpkg.com/@supabase/supabase-js@2';document.head.appendChild(s);"
  ></script>

  <!-- Konfigurasi publik (URL + anon key). Dibuat saat build Vercel dari
       Environment Variables (scripts/generate-config.js), atau diisi lokal. -->
  <script src="public_config.js"></script>

  <!-- Modul aplikasi -->
  <script src="js/supabase-client.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/profil.js"></script>
  <script src="js/auth-ui.js"></script>
  <script src="js/db.js"></script>
  <script src="js/tabungan.js"></script>
  <script src="js/pencapaian.js"></script>
  <script src="js/laporan.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
